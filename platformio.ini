; Breathing lamp firmware — Seeed XIAO ESP32-S3
; Uses the pioarduino platform for the current Arduino ESP32 core (3.x).
; If the platform URL ever stops working, check the pioarduino GitHub page
; for the current recommended link.

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
lib_deps = fastled/FastLED@3.9.16

; Serial monitor over the XIAO's own USB-C port
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
